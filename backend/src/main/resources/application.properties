spring.application.name=tabletime-backend
server.port=8081
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/tabletime}
spring.datasource.username=${POSTGRES_USER:tabletime}
spring.datasource.password=${POSTGRES_PASSWORD:tabletime}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
server.error.include-message=always
